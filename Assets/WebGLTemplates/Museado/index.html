<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
  <title>Museado · {{{ PRODUCT_NAME }}}</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1b1a18; overflow: hidden; }
    #unity-canvas { width: 100%; height: 100%; display: block; background: #1b1a18; outline: none; }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #1b1a18; color: #efe9dd; font-family: Georgia, "Times New Roman", serif; transition: opacity .5s;
    }
    #loading h1 { margin: 0; font-weight: normal; font-size: clamp(32px, 6vw, 64px); letter-spacing: .12em; }
    #loading p { margin: .4em 0 2em; font-size: clamp(13px, 1.6vw, 18px); letter-spacing: .3em; text-transform: uppercase; color: #b9ae99; }
    #bar { width: min(320px, 60vw); height: 2px; background: #3b3832; }
    #fill { height: 100%; width: 0; background: #c8a96a; transition: width .2s; }
    #loading.done { opacity: 0; pointer-events: none; }
    #folio { font-style: italic; font-size: clamp(18px, 2.6vw, 30px); margin: -1em 0 1.6em; min-height: 1.2em; }
    #error { color: #e8a39a; font-family: system-ui, sans-serif; font-size: 14px; margin-top: 1.5em; max-width: 80vw; text-align: center; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading">
    <h1>Museado</h1>
    <p>Historic Technology</p>
    <div id="folio"></div>
    <div id="bar"><div id="fill"></div></div>
    <div id="error"></div>
  </div>
  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    const loading = document.getElementById('loading');
    const params = new URLSearchParams(location.search);
    document.getElementById('folio').textContent = params.get('title') || params.get('folio') || '';
    createUnityInstance(document.getElementById('unity-canvas'), {
      dataUrl: "Build/{{{ DATA_FILENAME }}}",
      frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
      workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
      codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
    }, p => document.getElementById('fill').style.width = (100 * p) + '%')
      .then(() => { loading.classList.add('done'); document.getElementById('unity-canvas').focus(); })
      .catch(e => document.getElementById('error').textContent = e);
  </script>
</body>
</html>
